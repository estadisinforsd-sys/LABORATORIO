<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>SIRED · Patología Clínica - CLAS Santo Domingo</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#020617">
<style>
  html,body{margin:0;height:100%;background:#020617;overflow:hidden}
  #app{position:fixed;inset:0;width:100%;height:100%;border:0;background:#020617}
  #cargando{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
    background:#020617;color:#e2e8f0;font:700 14px/1.2 system-ui,sans-serif;letter-spacing:.3em;z-index:2;transition:opacity .5s}
  #cargando .rueda{width:46px;height:46px;border-radius:50%;border:3px solid rgba(34,211,238,.2);border-top-color:#22d3ee;animation:g 0.9s linear infinite}
  #cargando small{font-weight:500;letter-spacing:.05em;color:#94a3b8;opacity:0;transition:opacity .4s;text-align:center;padding:0 24px}
  #cargando small a{color:#22d3ee}
  @keyframes g{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="cargando">
  <div class="rueda"></div>
  <div>SIRED</div>
  <small id="ayuda">Si tarda mucho, <a id="directo" href="#">abrir directamente</a></small>
</div>
<iframe id="app" title="SIRED" allow="clipboard-write; web-share; fullscreen" referrerpolicy="no-referrer-when-downgrade"></iframe>

<noscript>Esta página necesita JavaScript activado.</noscript>
<script>
  // =====================================================================
  //  PEGA AQUÍ LA URL DE TU APLICACIÓN WEB DE APPS SCRIPT (termina en /exec)
  // =====================================================================
  var URL_APPS_SCRIPT = "https://script.google.com/macros/s/AKfycbzTdp3gz59thTAABAR18r2JwxOvfiDUoAVVELv1xlLN8VRmSjyQ3s6RA1TfGzCrw0Ul/exec";

  // Se conserva lo que venga después del "?" (por ejemplo ?verificar=SOL-2026...)
  var destino = URL_APPS_SCRIPT + (location.search || "");
  var marco = document.getElementById("app");
  marco.src = destino;
  document.getElementById("directo").href = destino;
  marco.addEventListener("load", function () {
    var c = document.getElementById("cargando");
    c.style.opacity = "0"; setTimeout(function () { c.style.display = "none"; }, 500);
  });
  setTimeout(function () { document.getElementById("ayuda").style.opacity = "1"; }, 9000);
</script>
</body>
</html>
